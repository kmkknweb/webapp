<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — ศาลเจ้า</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#f2c46b;--gold2:#ffe5b1;--red:#c91f3d;--text:#fff6eb;--muted:#d7c8bc;--line:rgba(255,255,255,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Kanit',sans-serif;background:radial-gradient(circle at top,#44101f 0%,#1a1020 34%,#0d0b10 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

    .login-card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.45)}

    .logo{text-align:center;margin-bottom:28px}
    .logo-icon{font-size:48px;line-height:1;margin-bottom:8px}
    .logo h1{font-size:20px;font-weight:800;color:var(--gold2);margin-bottom:4px}
    .logo p{font-size:13px;color:var(--muted)}

    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(242,196,107,.2),transparent);margin:4px 0 24px}

    label{display:block;font-size:13px;color:var(--gold2);margin-bottom:6px}
    .field{margin-bottom:18px}
    input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#2a2230;color:#fff;font:inherit;font-size:14px;outline:none;transition:.2s}
    input:focus{border-color:rgba(242,196,107,.45);box-shadow:0 0 0 3px rgba(242,196,107,.08)}

    .btn-login{width:100%;padding:15px;border:none;border-radius:15px;background:linear-gradient(135deg,#f2c46b,#ffe5b1);color:#23160d;font:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px;transition:.2s}
    .btn-login:hover{opacity:.9;transform:translateY(-1px)}
    .btn-login:active{transform:translateY(0)}
    .btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .error-msg{background:rgba(201,31,61,.15);border:1px solid rgba(201,31,61,.3);border-radius:12px;padding:10px 14px;font-size:13px;color:#ffb0b0;margin-top:14px;display:none}
    .error-msg.show{display:block}

    .footer{text-align:center;margin-top:24px;font-size:12px;color:var(--muted);opacity:.6}
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🏮</div>
      <h1>ระบบจัดการศาลเจ้า</h1>
      <p>เข้าสู่ระบบสำหรับผู้ดูแล</p>
    </div>
    <div class="divider"></div>

    <div class="field">
      <label for="email">อีเมล</label>
      <input id="email" type="email" placeholder="admin@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="footer">เฉพาะผู้ดูแลระบบเท่านั้น</div>
  </div>

  <script>
    const authApp = firebase.initializeApp({
      apiKey: "AIzaSyCwa0kXIAwtDIsFOLoK6pP1SpQaFE-_Sx8",
      authDomain: "admin-app-9f332.firebaseapp.com",
      projectId: "admin-app-9f332",
      storageBucket: "admin-app-9f332.firebasestorage.app",
      messagingSenderId: "374111934181",
      appId: "1:374111934181:web:7c15a13ad37c7a2136260c"
    });

    const auth = authApp.auth();

    // ถ้า login อยู่แล้ว ไปหน้า admin เลย
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'admin.html';
    });

    // กด Enter ใน password field
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');

      err.classList.remove('show');

      if (!email || !password) {
        showError('กรุณากรอกอีเมลและรหัสผ่าน');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';

      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'admin.html';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
        if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
          showError('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
        } else if (e.code === 'auth/too-many-requests') {
          showError('พยายามเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่');
        } else {
          showError('เกิดข้อผิดพลาด: ' + e.message);
        }
      }
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = msg;
      err.classList.add('show');
    }
  </script>
</body>
</html>
