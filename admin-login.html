<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — ศาลเจ้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #44101f 0%, #1a1020 34%, #0d0b10 100%);
      padding: 16px;
    }

    /* particles bg */
    .bg-dots {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(242,196,107,.18);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: .6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: linear-gradient(160deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.04) 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      padding: 36px 32px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(12px);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 12px rgba(242,196,107,.5));
    }
    .logo-title {
      font-size: 20px;
      font-weight: 700;
      color: #f2c46b;
      line-height: 1.3;
    }
    .logo-sub {
      font-size: 13px;
      color: rgba(255,246,235,.5);
      margin-top: 4px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(242,196,107,.3), transparent);
      margin: 0 0 26px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #ffe5b1;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
      color: #fff6eb;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      margin-bottom: 16px;
    }
    input:focus {
      border-color: rgba(242,196,107,.5);
      box-shadow: 0 0 0 3px rgba(242,196,107,.1);
    }
    input::placeholder { color: rgba(255,255,255,.25); }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #f2c46b, #ffe5b1);
      color: #23160d;
      font-family: 'Kanit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity .18s, transform .18s;
      letter-spacing: .5px;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(201,31,61,.15);
      border: 1px solid rgba(201,31,61,.3);
      color: #ffb0b0;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .error-msg.show { display: block; }

    .loading-ring {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(35,22,13,.3);
      border-top-color: #23160d;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="bg-dots" id="bgDots"></div>

<div class="card">
  <div class="logo">
    <span class="logo-icon">🏮</span>
    <div class="logo-title">ระบบจัดการศาลเจ้า</div>
    <div class="logo-sub">เฉพาะผู้ดูแลระบบเท่านั้น</div>
  </div>

  <div class="divider"></div>

  <label for="email">อีเมล</label>
  <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" />

  <label for="password">รหัสผ่าน</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

  <button class="btn" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>

  <div class="error-msg" id="errorMsg"></div>
</div>

<script type="module">
  // สร้าง floating dots
  const bgDots = document.getElementById('bgDots');
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const size = Math.random() * 6 + 3;
    d.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*12+8}s;
      animation-delay:${Math.random()*10}s;
    `;
    bgDots.appendChild(d);
  }

  // Firebase Auth
  const firebaseConfig = {
    apiKey: "AIzaSyCwa0kXIAwtDIsFOLoK6pP1SpQaFE-_Sx8",
    authDomain: "admin-app-9f332.firebaseapp.com",
    projectId: "admin-app-9f332",
    storageBucket: "admin-app-9f332.firebasestorage.app",
    messagingSenderId: "374111934181",
    appId: "1:374111934181:web:7c15a13ad37c7a2136260c"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // ถ้า login อยู่แล้วให้ข้ามไปเลย
  auth.onAuthStateChanged(user => {
    if (user) window.location.href = 'admin.html';
  });

  // กด Enter ได้
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('errorMsg');

    errEl.classList.remove('show');

    if (!email || !password) {
      showError('กรุณากรอกอีเมลและรหัสผ่าน');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-ring"></span>กำลังเข้าสู่ระบบ...';

    try {
      await auth.signInWithEmailAndPassword(email, password);
      window.location.href = 'admin.html';
    } catch (e) {
      btn.disabled = false;
      btn.innerHTML = 'เข้าสู่ระบบ';
      const msg =
        e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential'
          ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
          : e.code === 'auth/too-many-requests'
          ? 'ลองใหม่อีกครั้งในภายหลัง (ลองบ่อยเกินไป)'
          : 'เกิดข้อผิดพลาด กรุณาลองใหม่';
      showError(msg);
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
  }
</script>
</body>
</html>
