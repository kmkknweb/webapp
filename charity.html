<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
}

.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  bottom: 8%;
  width: 100%;
  text-align: center;
}

.btn {
  padding: 12px 24px;
  border-radius: 30px;
  border: none;
  background: #ffcc66;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="hero">
  <video autoplay muted loop playsinline>
    <source src="videos/charity-pot.mp4" type="video/mp4">
  </video>

  <div class="overlay">
    <div id="count">วันนี้มีผู้ได้รับอาหารแล้ว 842 คน</div>
    <button class="btn" onclick="donate()">ร่วมเติมโรงทาน</button>
  </div>
</div>

<script>
let count = 842;

function donate() {
  count += 10;
  document.getElementById("count").innerText =
    "วันนี้มีผู้ได้รับอาหารแล้ว " + count + " คน";
}
</script>

</body>
</html>
